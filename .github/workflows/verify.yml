name: Verify analytics portfolio
on: [push, pull_request]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python src/generate.py
      - run: python src/build.py
      - run: python src/powerbi.py
      - run: python src/figure.py
      - run: python src/verify.py
      - run: git diff --exit-code -- data/raw data/mart/*.csv powerbi docs/overview.svg
